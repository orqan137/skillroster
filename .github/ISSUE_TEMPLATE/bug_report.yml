name: 버그 제보
description: 재현 가능한 오류나 예상과 다른 동작 제보
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 인증정보, 비공개 소스 코드와 실제 프롬프트는 첨부하지 마세요. 보안 문제는 공개 Issue 대신 Security Advisory를 사용해주세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제
      description: 발생한 문제와 기대한 동작을 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 어떤 결과가 확인되면 이 문제가 해결된 것으로 볼 수 있는지 적어주세요.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      options: [Windows, macOS, Linux, Docker, 기타]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SkillRoster 버전 또는 commit
      placeholder: v0.1.0 또는 51dba5a
  - type: textarea
    id: logs
    attributes:
      label: 오류 메시지
      description: 민감정보를 제거한 오류 메시지와 요청 ID
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 기존 Issue에서 같은 문제를 찾지 못했습니다.
          required: true
        - label: 첨부 내용에서 인증정보와 비공개 코드를 제거했습니다.
          required: true
