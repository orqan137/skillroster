name: 유지보수 작업
description: CI, 의존성, 문서, 리팩터링과 운영 작업 정의
title: "chore: "
labels: [ci]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 사용자 기능이 아닌 이 작업이 지금 필요한 이유를 적어주세요.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      options: [CI와 배포, 의존성, 문서, 리팩터링, 보안 강화, 기타]
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 변경 구현
        - [ ] 회귀 테스트
        - [ ] 운영 문서 갱신
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 위험과 되돌리기
      description: 실패 영향과 rollback 방법을 적어주세요.
    validations:
      required: true
