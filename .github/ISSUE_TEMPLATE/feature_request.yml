name: 기능 제안
description: 새로운 기능이나 사용 흐름 개선 제안
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 현재 어떤 상황에서 무엇이 불편한지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 원하는 동작과 사용자 흐름을 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 테스트하거나 관찰할 수 있는 완료 기준을 체크리스트로 적어주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 영향 범위
      options:
        - label: 공개 레지스트리 형식 또는 JSON Schema 변경
        - label: 수집되는 실행 근거 또는 개인정보 범위 변경
        - label: Git 인증·commit·push 방식 변경
        - label: UI와 문서만 변경
